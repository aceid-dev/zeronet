name: Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Load project env
        shell: bash
        run: |
          set -a
          . ./.env
          set +a

          vars=(
            IMAGE_NAME
            DOCKER_PLATFORMS
            ALPINE_VERSION
            PIP_VERSION
            SETUPTOOLS_VERSION
            OCI_SOURCE
            ZERONET_REPO_URL
            ZERONET_REPO_REF
          )

          for var in "${vars[@]}"; do
            printf '%s=%s\n' "$var" "${!var}" >> "$GITHUB_ENV"
          done

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.DOCKER_PLATFORMS }}
          push: true
          build-args: |
            ALPINE_VERSION=${{ env.ALPINE_VERSION }}
            PIP_VERSION=${{ env.PIP_VERSION }}
            SETUPTOOLS_VERSION=${{ env.SETUPTOOLS_VERSION }}
            OCI_SOURCE=${{ env.OCI_SOURCE }}
            ZERONET_REPO_URL=${{ env.ZERONET_REPO_URL }}
            ZERONET_REPO_REF=${{ env.ZERONET_REPO_REF }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
